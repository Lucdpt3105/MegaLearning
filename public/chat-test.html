<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MegaLearning - Chat Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .header h1 { font-size: 24px; margin-bottom: 5px; }
        .header p { opacity: 0.9; font-size: 14px; }
        .chat-rooms {
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
        }
        .room-list { display: grid; gap: 10px; margin-top: 15px; }
        .room-item {
            padding: 15px;
            background: #f9fafb;
            border-radius: 8px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }
        .room-item:hover {
            background: #f3f4f6;
            border-color: #667eea;
        }
        .room-item.active {
            background: #eef2ff;
            border-color: #667eea;
        }
        .room-name { font-weight: 600; color: #1f2937; margin-bottom: 5px; }
        .room-type {
            display: inline-block;
            padding: 2px 8px;
            background: #667eea;
            color: white;
            border-radius: 4px;
            font-size: 12px;
        }
        .chat-container {
            height: 400px;
            display: flex;
            flex-direction: column;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f9fafb;
        }
        .message {
            margin-bottom: 15px;
            padding: 12px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .message-user {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .message-text { color: #374151; line-height: 1.5; }
        .message-time {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 5px;
        }
        .input-area {
            display: flex;
            gap: 10px;
            padding: 20px;
            background: white;
            border-top: 1px solid #e5e7eb;
        }
        .input-area input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
        }
        .input-area input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn:active { transform: translateY(0); }
        .btn-create {
            margin-top: 10px;
            width: 100%;
            padding: 10px;
            font-size: 14px;
        }
        .status {
            text-align: center;
            padding: 15px;
            background: #fef3c7;
            color: #92400e;
            font-size: 14px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }
        .empty {
            text-align: center;
            padding: 40px;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 MegaLearning Chat</h1>
            <p>Test Chat System - No Login Required</p>
        </div>

        <div class="chat-rooms">
            <h3 style="margin-bottom: 10px;">Available Rooms</h3>
            <div class="room-list" id="roomList">
                <div class="loading">Loading rooms...</div>
            </div>
            <button class="btn btn-create" onclick="createTestRoom()">➕ Create Test Room</button>
        </div>

        <div class="chat-container">
            <div class="messages" id="messages">
                <div class="empty">Select a room to start chatting</div>
            </div>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Type a message..." disabled>
                <button class="btn" id="sendBtn" onclick="sendMessage()" disabled>Send</button>
            </div>
        </div>

        <div class="status" id="status">
            Ready to chat! 🚀
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api/chat';
        let currentRoom = null;
        let pollInterval = null;

        // Load rooms
        async function loadRooms() {
            try {
                const response = await fetch(`${API_URL}/rooms`);
                const data = await response.json();
                
                const roomList = document.getElementById('roomList');
                if (data.success && data.data.length > 0) {
                    roomList.innerHTML = data.data.map(room => `
                        <div class="room-item" onclick="selectRoom(${room.room_id})">
                            <div class="room-name">${room.room_name}</div>
                            <span class="room-type">${room.room_type}</span>
                            <span style="color: #6b7280; font-size: 12px; margin-left: 10px;">
                                ${room.members_count || 0} members
                            </span>
                        </div>
                    `).join('');
                } else {
                    roomList.innerHTML = '<div class="empty">No rooms yet. Create one!</div>';
                }
            } catch (error) {
                document.getElementById('roomList').innerHTML = 
                    '<div class="empty" style="color: #ef4444;">Error loading rooms</div>';
                console.error('Error:', error);
            }
        }

        // Select room
        async function selectRoom(roomId) {
            currentRoom = roomId;
            
            // Highlight selected room
            document.querySelectorAll('.room-item').forEach(el => el.classList.remove('active'));
            event.target.closest('.room-item').classList.add('active');
            
            // Enable input
            document.getElementById('messageInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;
            
            // Load messages
            await loadMessages();
            
            // Start polling for new messages
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(loadMessages, 3000);
            
            updateStatus(`Connected to room ${roomId}`);
        }

        // Load messages
        async function loadMessages() {
            if (!currentRoom) return;
            
            try {
                const response = await fetch(`${API_URL}/rooms/${currentRoom}/messages`);
                const data = await response.json();
                
                const messagesDiv = document.getElementById('messages');
                if (data.success && data.data.data.length > 0) {
                    messagesDiv.innerHTML = data.data.data.map(msg => `
                        <div class="message">
                            <div class="message-user">${msg.user?.name || 'Unknown'}</div>
                            <div class="message-text">${msg.message_text}</div>
                            <div class="message-time">${new Date(msg.created_at).toLocaleString()}</div>
                        </div>
                    `).join('');
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                } else {
                    messagesDiv.innerHTML = '<div class="empty">No messages yet. Start the conversation!</div>';
                }
            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }

        // Send message
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (!text || !currentRoom) return;
            
            try {
                const response = await fetch(`${API_URL}/rooms/${currentRoom}/messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message_text: text })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    input.value = '';
                    await loadMessages();
                    updateStatus('Message sent! ✅');
                } else {
                    updateStatus('Error sending message ❌');
                }
            } catch (error) {
                updateStatus('Error sending message ❌');
                console.error('Error:', error);
            }
        }

        // Create test room
        async function createTestRoom() {
            const roomName = prompt('Enter room name:', 'Test Room ' + Date.now());
            if (!roomName) return;
            
            try {
                const response = await fetch(`${API_URL}/rooms`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        room_name: roomName,
                        room_type: 'group',
                        include_ai: false
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    updateStatus('Room created! ✅');
                    await loadRooms();
                } else {
                    updateStatus('Error creating room ❌');
                }
            } catch (error) {
                updateStatus('Error creating room ❌');
                console.error('Error:', error);
            }
        }

        // Update status
        function updateStatus(message) {
            document.getElementById('status').textContent = message;
            setTimeout(() => {
                document.getElementById('status').textContent = 'Ready to chat! 🚀';
            }, 3000);
        }

        // Enter to send
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Initial load
        loadRooms();
    </script>
</body>
</html>
